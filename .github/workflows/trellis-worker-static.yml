name: TRELLIS worker static check
on:
  push:
    branches: [main, develop]
    paths:
      - 'services/trellis2/**'
      - '.github/workflows/trellis-worker-static.yml'
  pull_request:
    paths:
      - 'services/trellis2/**'
      - '.github/workflows/trellis-worker-static.yml'
jobs:
  compile-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile services/trellis2/generate.py
