name: Deploy preview (opt-in)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webxr-preview
  cancel-in-progress: false
jobs:
  preview:
    if: vars.XR_PREVIEW_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: xr-preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" && test -n "$VERCEL_TOKEN"
      - run: npm ci
      - run: npm run check
      - run: npx --yes vercel@48.10.2 pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@48.10.2 build --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@48.10.2 deploy --prebuilt --token="$VERCEL_TOKEN"
