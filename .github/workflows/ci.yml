name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        menu-mode: [demo, published]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_MENU_MODE: ${{ matrix.menu-mode }}
      # CI only typechecks and builds; it never drives the managed browser, so
      # skip the Chromium download that @iwsdk/vite-plugin-dev would otherwise
      # pull in through Playwright.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run security:audit

      - run: node scripts/check-image-runtime.mjs

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peekaplate-xr-${{ matrix.menu-mode }}-dist
          path: dist
          retention-days: 7
