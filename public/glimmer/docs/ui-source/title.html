<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css"><style>
.scrim{background:linear-gradient(rgba(5,7,26,.15),rgba(5,7,26,.55))}
.ban{position:absolute;left:50%;transform:translateX(-50%);top:64px;width:min(1500px,calc(var(--W) - var(--safe-l) - var(--safe-r)))}
.ban .rail{position:relative;margin:0 -40px}
.ban .fl{display:flex;gap:8px;margin-top:-8px}.ban .flap{flex:1;height:392px}
.tt{position:absolute;left:0;right:0;top:64px;text-align:center;color:var(--ink)}
.tt .d1{font-size:224px;line-height:200px}
.tt .h1{color:var(--ink);font-size:112px;line-height:112px;margin-top:8px}
.go{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 96px);display:flex;align-items:center;gap:24px;padding:0 32px;min-height:132px}
.go span{font-size:64px;line-height:64px}
.phone .go .key{display:none}
.tap{display:none}.phone .tap{display:inline-block}
</style></head><body><div class="scene game"><div class="scrim"></div>
<div class="ban"><div class="rail"></div><div class="fl"><div class="flap red"></div><div class="flap red" style="flex:2.2"></div><div class="flap red"></div></div>
<div class="tt"><div class="d1 live">Glimmer Plate</div><div class="h1 live">Neon Rain Market</div></div></div>
<div class="go panel"><span class="key">E</span><i class="ico tap" data-i="tap"></i><span class="live" id="g"></span></div>
</div><script src="common.js"></script><script>document.getElementById('g').textContent=document.querySelector('.scene').classList.contains('phone')?'Tap to enter the market':'Press any key to enter';</script></body></html>
