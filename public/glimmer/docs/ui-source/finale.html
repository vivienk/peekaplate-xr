<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css"><style>
.scrim{background:rgba(5,7,26,.6)}
.ban{position:absolute;left:50%;transform:translateX(-50%);top:40px;width:min(1400px,calc(var(--W) - 96px))}
.ban .rail{position:relative;margin:0 -40px}
.ban .fl{display:flex;gap:8px;margin-top:-8px}

.ban .sub{font-size:52px;line-height:60px;color:var(--ink)}
.card{position:absolute;left:50%;transform:translateX(-50%);top:380px;width:min(1480px,calc(var(--W) - 96px));padding:24px 48px;display:flex;flex-direction:column;align-items:center;gap:24px}
.st3{display:flex;gap:48px}
.st3 img{width:192px;height:192px}
.stats{display:flex;gap:64px;white-space:nowrap;font-family:"Jersey 10";font-size:72px;line-height:72px}
.stats span{display:flex;align-items:center;gap:16px}
.btns{display:flex;gap:48px;margin-top:8px}
.lan{position:absolute;color:var(--gold);width:96px;height:96px}
.narrow .card{top:350px;gap:16px}.narrow .st3 img{width:128px;height:128px}
</style></head><body><div class="scene game"><div class="scrim"></div>

</div><script src="common.js"></script></body></html>
